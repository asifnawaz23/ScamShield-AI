[build]
  base = "/"
  # Install client deps INCLUDING devDependencies (vite/tailwind/typescript live
  # there and are required to build), build the SPA, then install the server
  # runtime deps for the function bundle. --include=dev is explicit so a
  # production NODE_ENV never strips the build tools ("tsc/vite not found").
  command = "npm --prefix client install --include=dev && npm --prefix client run build && npm --prefix server install --omit=dev"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"
  # Ensure npm installs devDependencies during the build even if NODE_ENV=production.
  NPM_FLAGS = "--include=dev"

[functions]
  directory = "server/netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"